# Keeps the reusable workflows' actions current, pinned to full commit SHAs (the version is the comment beside each).
# Dependabot looks every weekday; all action bumps arrive together in one pull request, and every update merges itself
# once `gitleaks` passes on it (dependabot-automerge.yml runs here on pull_request; org ruleset "shared repos: CI gate
# (gitleaks)"), majors too. That check does not run the packages' gate: a bumped action meets package-ci.yml at the
# next package run, which calls it at @main.
# pre-commit: the gitleaks hook's frozen rev. Not here: gitleaks' release in gitleaks.yml (VERSION and both SHA-256s),
# a pin no ecosystem reads; gitleaks-release.yml moves it each morning, so it and every repository's hook (each
# repository watches pre-commit too) move the same day.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
