# Keeps the reusable workflows' actions current, pinned to full commit SHAs (the version is the comment beside each).
# Dependabot looks every weekday; all action bumps arrive together in one pull request, merged by hand once a package's
# CI is green on it. No dependabot-automerge caller here: this repository requires no check, so auto-merge would merge
# at once.
# pre-commit: the gitleaks hook. Its pull request is the signal for the move gitleaks.yml describes, done by hand in
# that same pull request: VERSION and both SHA-256s, then the pre-commit rev in every repository. The other
# repositories do not watch pre-commit, so the hook and the CI's gitleaks never part.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
