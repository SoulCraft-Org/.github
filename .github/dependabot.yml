# Keeps this repo's action pins and its pre-commit hook current, each ecosystem in one grouped pull request. A new
# release waits 14 days first, as Git Crafter's own .github/dependabot.yml (the Quality page's params.cooldown_days);
# default-days is the one cooldown key GitHub documents for every ecosystem. The github-actions entry also bumps the
# Git Crafter pin in ci.yml and the Pages workflows together. Not here: the tool versions and checksums inside the reusable
# workflows' run scripts, and the pins inside workflow-templates/, which no Dependabot ecosystem reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 14
    groups:
      pre-commit:
        patterns: ["*"]
