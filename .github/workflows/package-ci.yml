# The gate every SoulCraft workflow package runs, called from its own .github/workflows/ci.yml:
#
#   jobs:
#     verify:
#       uses: SoulCraft-Org/.github/.github/workflows/package-ci.yml@main
#       secrets: inherit
#
# The same three steps a maintainer runs before a commit (ComfyUI Base's _build/verify.sh), then the cast guard:
#   1. <name>-<host>.zip matches the working tree       (package.py --check)
#   2. the suite, from the repository                  (<name>-script.sh test)
#   3. the suite, from the EXTRACTED zip                (what a pod runs)
#   4. no name from the private test cast in the zip    (workspace's tools/cast/cast.py guard)
# No GPU and no provisioned testbed here, so the comfyui/runpod/gpu tiers skip themselves by name.
#
# With the organization variable CI_ROUTER=on, a `route` job picks verify's runner first: a free slot, else overflow
# minutes (README "The CI router").
#
# The layout is the base's workspace shape (py/pkgdirs.py, base 3.6.0): $GITHUB_WORKSPACE is the workspace, the package
# is checked out at <workspace>/<name>, ComfyUI Base at <workspace>/ComfyUI-Base (a base checkout is never a package).
name: package-ci

on:
  workflow_call:
    inputs:
      base-ref:
        description: "ComfyUI Base tag or branch; empty = its newest base-v* tag (base 3.0.0: always the newest)"
        type: string
        default: ""
      testbed:
        description: "provision the shared testbed (ComfyUI, the packs, a CPU venv and server) before verify.sh"
        type: boolean
        default: true
      require-cast-guard:
        description: "fail when the cast guard cannot run (no soulcraft-ci app secrets); the release path sets it"
        type: boolean
        default: false
    secrets:
      CI_APP_ID:
        required: false
      CI_APP_KEY:
        required: false
      ROUTER_APP_KEY:
        required: false

permissions:
  contents: read

jobs:
  # The router (README "The CI router"). GitHub has no fallback between runner labels (a job's labels are AND), so this
  # job picks verify's runner before verify starts: a free self-hosted slot when one is idle; else, while
  # CI_OVERFLOW_ENABLED is true, the first label in CI_OVERFLOW_LABELS that has used less than 90% of its free minutes
  # this month; else the free pool anyway (verify waits for a slot, as before). Only with CI_ROUTER=on in a private
  # repository (CI_RUNNER=hf); otherwise it is skipped and verify picks its runner exactly as before.
  # It runs on its own light runner processes (label soulcraft-router), never GitHub-hosted: a hosted job is billed a
  # whole minute. It reads and never writes: the runner list, and for the minute count GitHub's own job history (below).
  # It never fails: no router token (the app not set up, a Dependabot run), an API error or unreadable data all route
  # to the free pool. No concurrency group: GitHub scopes those to one repository, and a wrong guess between two routers
  # costs one job a wait for a slot, never minutes.
  route:
    if: vars.CI_RUNNER == 'hf' && vars.CI_ROUTER == 'on'
    runs-on: soulcraft-router
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      overflow: ${{ steps.pick.outputs.overflow }}
    env:
      HAS_KEY: ${{ vars.ROUTER_CLIENT_ID != '' && secrets.ROUTER_APP_KEY != '' }}
    steps:
      - name: router token (soulcraft-router app, read only)
        id: app
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ROUTER_CLIENT_ID }}
          private-key: ${{ secrets.ROUTER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read
          permission-actions: read

      # Minutes used this month per overflow label, from the jobs GitHub ran: every job of this month's completed runs
      # that called this workflow (the only one the router routes), counted by its labels, each rounded up to a whole
      # minute as GitHub and Blacksmith bill it, re-runs included. Each run is read once and kept in a cache in the
      # router process's tool folder (the job hooks keep _tool), so a router reads only the runs that finished since its
      # last look; a fresh process catches up over a few routes (at most BUDGET runs each) and, until it has, routes
      # nothing to overflow. Runs still in progress are not counted yet: the 10% headroom covers them.
      - name: a free slot, or overflow
        id: pick
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          POOL: ${{ vars.CI_POOL == 'on' && 'soulcraft-free' || 'soulcraft-hf' }}
          RESERVE: ${{ vars.CI_ROUTER_RESERVE }}
          ENABLED: ${{ vars.CI_OVERFLOW_ENABLED }}
          ORDER: ${{ vars.CI_OVERFLOW_LABELS }}
          BUDGET: 400
        run: |
          month="$(date -u +%Y-%m)"
          [[ "$RESERVE" =~ ^[0-9]+$ ]] || RESERVE=0
          api(){ curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/$1"; }
          # the month's count: lines "<run id> <label> <minutes>" (label "-" for a run with no overflow job), one file per month
          count(){
            local cache want r page runs id n=0
            cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/soulcraft-router/jobs-$month.txt"
            mkdir -p "${cache%/*}" && touch "$cache" || return 1
            want="$(for e in $ORDER; do echo "${e%%=*}"; done | jq -R . | jq -sc .)"
            for r in $(api "installation/repositories?per_page=100" | jq -r '.repositories[] | select(.private) | .name') ; do
              page=1
              while :; do
                runs="$(api "repos/$GITHUB_REPOSITORY_OWNER/$r/actions/runs?status=completed&created=%3E%3D$month-01&per_page=100&page=$page")" || return 1
                for id in $(jq -r '.workflow_runs[] | select(any(.referenced_workflows[]?; .path | contains("/package-ci.yml@"))) | .id' <<< "$runs"); do
                  grep -q "^$id " "$cache" && continue
                  [ "$n" -lt "$BUDGET" ] || return 2
                  n=$((n + 1))
                  api "repos/$GITHUB_REPOSITORY_OWNER/$r/actions/runs/$id/jobs?filter=all&per_page=100" | jq -r --arg id "$id" --argjson want "$want" '
                    [.jobs[] | select(.started_at and .completed_at) | . as $j | $j.labels[] | select(IN($want[]))
                      | "\($id) \(.) \((($j.completed_at | fromdateiso8601) - ($j.started_at | fromdateiso8601) + 59) / 60 | floor)"]
                    | if length == 0 then "\($id) - 0" else .[] end' >> "$cache" || return 1
                done
                [ "$(jq '.workflow_runs | length' <<< "$runs")" -eq 100 ] || break
                page=$((page + 1))
              done
            done
            echo "$cache"
          }
          labels="[\"$POOL\"]"; overflow=""
          if [ -z "$GH_TOKEN" ]; then
            why="no router token (ROUTER_CLIENT_ID / ROUTER_APP_KEY unset, the app's permissions not accepted, or a Dependabot run)"
          elif ! runners="$(api "orgs/$GITHUB_REPOSITORY_OWNER/actions/runners?per_page=100")" \
               || ! read -r online idle < <(jq -r --arg p "$POOL" \
                 '[.runners[] | select(.status == "online" and any(.labels[]; .name == $p))] | "\(length) \(map(select(.busy | not)) | length)"' <<< "$runners") \
               || ! [[ "$idle" =~ ^[0-9]+$ ]]; then
            why="cannot read the organization's runners"
          elif [ "$idle" -gt "$RESERVE" ]; then
            why="$idle of $online online $POOL slots idle"
          else
            why="$idle of $online online $POOL slots idle (reserve $RESERVE)"
            if [ "$ENABLED" != true ]; then
              why="$why; overflow is off (CI_OVERFLOW_ENABLED=${ENABLED:-unset}): wait for a slot"
            elif cache="$(count)"; then
              for entry in $ORDER; do
                label="${entry%%=*}"; cap="${entry#*=}"
                [[ "$label" =~ ^[A-Za-z0-9._-]+$ && "$cap" =~ ^[0-9]+$ ]] || { echo "::warning::CI_OVERFLOW_LABELS: '$entry' is not <label>=<minutes>"; continue; }
                u="$(awk -v l="$label" '$2 == l { s += $3 } END { print s + 0 }' "$cache")"
                if [ $((u * 10)) -lt $((cap * 9)) ]; then
                  labels="[\"$label\"]"; overflow="$label"
                  why="$why; overflow to $label ($u of its $cap free minutes used in $month)"
                  break
                fi
                why="$why; $label is at $u of $cap"
              done
              [ -n "$overflow" ] || why="$why; no overflow allowance under 90% this month: wait for a slot"
            elif [ $? = 2 ]; then
              why="$why; this month's minute count is still catching up ($BUDGET runs read this time): wait for a slot"
            else
              why="$why; cannot count this month's overflow minutes: wait for a slot"
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "overflow=$overflow" >> "$GITHUB_OUTPUT"
          [ -z "$overflow" ] || echo "::notice::verify overflows to $overflow"
          echo "route: $labels: $why" | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    needs: route
    if: ${{ !cancelled() }}         # also when route is skipped (CI_ROUTER unset)
    # The router's pick when it ran. Otherwise CI_RUNNER (organization variable, private repositories only): "hf" while
    # GitHub-hosted minutes are out; the job then runs on SoulCraft-Org's self-hosted runners (runner group hf-free).
    # Unset or "github": GitHub's ubuntu-24.04.
    # Self-hosted, CI_POOL picks which: "on" = label soulcraft-free, any free runner, the never-sleeping linux-arm64 one on
    # Oracle Cloud included (this gate is proven on arm64; workspace ci/oracle-runner/); unset = label soulcraft-hf, the
    # Hugging Face Spaces (x64, workspace ci/hf-runner/).
    runs-on: ${{ needs.route.outputs.labels && fromJSON(needs.route.outputs.labels) || (vars.CI_RUNNER == 'hf' && (vars.CI_POOL == 'on' && 'soulcraft-free' || 'soulcraft-hf') || 'ubuntu-24.04') }}
    timeout-minutes: 90
    env:
      NAME: ${{ github.event.repository.name }}
      # where ComfyUI Base lives: the org variable once org/apply.sh has moved it, else its home in this organization
      BASE_REPO: ${{ vars.COMFY_BASE_REPO || 'SoulCraft-Org/ComfyUI-Base' }}
      HAS_APP: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_KEY != '' }}
    steps:
      # The runner image leaves too little disk for the testbed (every pack, a torch venv) plus Chromium: the
      # workspace's integration run 38860674317 reached 92 MB free and the server never came up. These toolchains are never used here.
      # First, before checkout and setup-uv: image-creator-krea-2#2 ran out of disk twice before setup-uv (2026-10-16).
      - name: room on the runner (drop the image's unused toolchains)
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.event.repository.name }}

      # A pull request that changes only notes skips every step below: each changed file is Markdown, not the
      # handbook (the zip ships it) or a README (suites read them), and named by no other file in the package (a
      # suite that reads CLAUDE.md or HANDOFF.md names it; so does a ZIP_EXTRA row). The job still runs and passes,
      # so the required check `verify / verify` reports success; a workflow-level `paths` filter would leave it
      # pending forever. The filter is a step, not a job of its own, so a code change waits for a runner once.
      # Releases, dispatches and anything unclear (the compare call fails, 300 files or more) run the whole gate.
      - name: what this pull request changes (notes only skip the gate)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gate=run
          if [ "$EVENT" = pull_request ] && files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
               --jq 'if (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else error("300 files or more") end')" \
             && [ -n "$files" ]; then
            gate=skip
            while IFS= read -r f; do
              b="${f##*/}"
              case "$b" in
                "$NAME-handbook.md"|README.md) gate=run ;;
                *.md) if git -C "$NAME" grep -qIF -e "$b" -- ':(exclude)*.md'; then gate=run; fi ;;
                *) gate=run ;;
              esac
              if [ "$gate" = run ]; then echo "the gate runs: $f"; break; fi
            done <<< "$files"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          if [ "$gate" = skip ]; then
            echo "::notice::notes only (Markdown that nothing ships or reads): the gate is skipped, the check passes"
            echo "Notes only: the gate was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ComfyUI Base
        if: steps.scope.outputs.gate == 'run'
        run: |
          ref="${{ inputs.base-ref }}"
          if [ -z "$ref" ]; then
            ref="$(git ls-remote --tags --refs "https://github.com/$BASE_REPO" 'base-v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)"
          fi
          [ -n "$ref" ] || { echo "::error::no base-v* tag found on $BASE_REPO"; exit 1; }
          rm -rf ComfyUI-Base      # a self-hosted runner keeps the workspace between runs
          git clone -q --depth 1 --branch "$ref" "https://github.com/$BASE_REPO" ComfyUI-Base
          echo "ComfyUI Base $ref ($(cat ComfyUI-Base/VERSION))" >> "$GITHUB_STEP_SUMMARY"
          echo "COMFY_BASE=$GITHUB_WORKSPACE/ComfyUI-Base" >> "$GITHUB_ENV"
          echo "BASE_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # base_test reaches pytest through `uv run --no-project --python <newest> --with pytest`. The Oracle runners keep
      # their uv cache on disk between jobs (UV_CACHE_DIR, workspace ci/oracle-runner/): the GitHub cache would only
      # download it again and upload it whole, so they skip it.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.scope.outputs.gate == 'run'
        with:
          enable-cache: ${{ !startsWith(runner.name, 'soulcraft-oracle') }}

      # The live App-view tier drives the real frontend through _build/appview.py, a uv script that pins its own
      # playwright; the browser build has to match that pin, so it is installed per pinned version (none: no-op).
      - name: Chromium for the App-view tier (each playwright version the package's _build pins)
        if: steps.scope.outputs.gate == 'run'
        env:
          DEPS: ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}   # the HF runner's image has them (no sudo)
        run: |
          for v in $(grep -rhoE 'playwright==[0-9.]+' "$NAME/_build" 2>/dev/null | sort -u | cut -d= -f3); do
            uvx --from "playwright==$v" playwright install $DEPS chromium
          done

      # The suites import what a pod has (torch, numpy, PIL, ComfyUI itself) and run their comfyui tier against a live
      # /object_info. On the Mac that is the shared testbed; here it is provisioned the same way: ComfyUI at its newest
      # release, the base packs and THIS package's packs at HEAD, a CPU venv, the server on 8199. verify.sh finds it
      # beside the base (testbed/ and .testbed-server.port). Without it most suites fail on a missing torch or numpy.
      - name: the shared testbed (ComfyUI + this package's packs, CPU server)
        if: steps.scope.outputs.gate == 'run' && inputs.testbed
        run: bash "$COMFY_BASE/testbed.sh" --server

      - name: verify (zip, suite from the repo, suite from the zip)
        if: steps.scope.outputs.gate == 'run'
        # ComfyUI Base 3.16.0's verify.sh otherwise starts a second server of its own beside the 8199 one.
        # Error log row 106: VERIFY_SUITE=zip (base 3.17.1+) runs every test once: from the extracted zip, then from the repo only
        # the ones that skipped there. Only for the six packages whose repo-only tests were audited; the others keep both passes.
        env:
          VERIFY_SERVER: ${{ inputs.testbed && 'reuse' || 'none' }}
          VERIFY_SUITE: ${{ contains(fromJSON('["character-creator-krea-2","image-creator-krea-2","image-creator-flux-2-dev","photo-auditor","video-creator-minimax-h3","video-continuer-minimax-h3"]'), github.event.repository.name) && 'zip' || 'both' }}
        run: bash "$COMFY_BASE/_build/verify.sh" "$NAME"

      - name: stop the testbed
        if: always() && steps.scope.outputs.gate == 'run' && inputs.testbed
        run: bash "$COMFY_BASE/testbed.sh" --stop || true

      - name: soulcraft-ci token (reads the private workspace for the cast guard)
        id: app
        if: steps.scope.outputs.gate == 'run' && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: workspace

      - name: the workspace's cast tool
        if: steps.scope.outputs.gate == 'run' && env.HAS_APP == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/workspace
          token: ${{ steps.app.outputs.token }}
          path: workspace
          sparse-checkout: tools/cast

      - name: cast guard (no private test-cast name in the zip)
        if: steps.scope.outputs.gate == 'run'
        run: |
          if [ "$HAS_APP" != "true" ]; then
            msg="cast guard NOT run: the org secrets CI_APP_ID / CI_APP_KEY (the soulcraft-ci app) are not set"
            if [ "${{ inputs.require-cast-guard }}" = "true" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"; exit 0
          fi
          host="$(python3 "$COMFY_BASE/_build/package.py" --host "$NAME")"
          python3 workspace/tools/cast/cast.py guard "$NAME/$NAME-$host.zip"

  # Secrets anywhere in the package's history (gitleaks, shared by every repository in the organization).
  gitleaks:
    uses: SoulCraft-Org/.github/.github/workflows/gitleaks.yml@main
