name: ci

# Git Crafter's CI standard: its reusable workflow checks every workflow against the standard and runs the short job,
# here two cheap checks on what this repo holds (the standard itself parses every workflow). It runs on pull requests
# only: main takes only squash merges of a pull request that passed ci / ci-ok, so a push run would repeat it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@6899e46174d55abddc0324ee7c61c6f1e3631561 # v7.1.0
    with:
      paths: |
        .github/**
        workflow-templates/**
        profile/**
        quality/**
        **/*.md
        .pre-commit-config.yaml
      short: |
        python3 -I -m py_compile profile/make_svgs.py
        git ls-files -z '*.json' | xargs -0 python3 -I -c 'import json, sys; [json.load(open(f, encoding="utf-8")) for f in sys.argv[1:]]'
