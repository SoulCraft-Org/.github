name: node-proof

# Temporary: proves the Gemini CLI installs on Node 26 while the review switch is off. Removed in the next commit.
on:
  pull_request:
    paths:
      - ".github/workflows/node-proof.yml"

permissions:
  contents: read

concurrency:
  group: node-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the Gemini CLI as gemini-review.yml does
        env:
          GEMINI_CLI_VERSION: 0.70.0
        run: |
          node --version
          npm install --silent --no-audit --global "@google/gemini-cli@${GEMINI_CLI_VERSION}"
          gemini --version
