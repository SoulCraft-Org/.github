# Secret scanning that costs nothing: gitleaks over the WHOLE git history, failing on any finding (secret values are
# redacted in the log). Every SoulCraft-Org repository calls it: the packages through package-ci.yml, the others from
# their own gitleaks.yml; it also runs here on this repository's pushes and pull requests.
#
#   jobs:
#     gitleaks:
#       uses: SoulCraft-Org/.github/.github/workflows/gitleaks.yml@main
#
# A false positive goes in the repository's .gitleaksignore (one finding fingerprint per line, printed in the log).
# gitleaks is its release tarball for the runner's architecture, checked against the SHA-256 the release publishes before
# it runs. Dependabot cannot move VERSION, SHA256_X64 and SHA256_ARM64; gitleaks-release.yml does, each morning: a new
# release becomes a pull request with the linux_x64 and linux_arm64 lines of its gitleaks_<VERSION>_checksums.txt, which
# merges itself once this workflow passes on it (here, both tarballs are checked). Each repository's pre-commit rev moves
# the same day with its own Dependabot pre-commit pull request.
name: gitleaks

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # CI_RUNNER and CI_POOL: see package-ci.yml (private repositories only; public ones never see them and stay on
    # GitHub's runners). Proven on linux-arm64 and x64 alike (gitleaks 8.30.1, both tarballs, 2026-10-16).
    runs-on: ${{ vars.CI_RUNNER == 'hf' && (vars.CI_POOL == 'on' && 'soulcraft-free' || 'soulcraft-hf') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      VERSION: 8.30.1
      SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # every commit, not just the tip
          persist-credentials: false

      - name: gitleaks ${{ env.VERSION }} (checksum verified)
        run: |
          case "$RUNNER_ARCH" in
            X64)   arch=x64;   sum="$SHA256_X64" ;;
            ARM64) arch=arm64; sum="$SHA256_ARM64" ;;
            *) echo "::error::no gitleaks tarball pinned for $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_$arch.tar.gz"
          echo "$sum  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      # This repository's own runs only (a caller's github.repository is the caller): the other architecture's tarball
      # against its sum too, so a wrong SHA256_ARM64 fails gitleaks-release's pull request on GitHub's x64 runner here,
      # never the arm64 jobs of every private repository after the merge.
      - name: the other architecture's gitleaks ${{ env.VERSION }} (checksum verified)
        if: github.repository == 'SoulCraft-Org/.github'
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=arm64; sum="$SHA256_ARM64" ;;
            *)   arch=x64;   sum="$SHA256_X64" ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/other.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_$arch.tar.gz"
          echo "$sum  $RUNNER_TEMP/other.tgz" | sha256sum -c -

      # HEAD's whole history (on a pull request, the merge preview: main plus the PR's commits), not --all. The
      # full-depth checkout fetches every branch, and an unscoped scan let one open PR's finding fail every other PR.
      - name: no secret anywhere in the history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose --exit-code 1 .'
