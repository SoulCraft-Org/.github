name: pages

# A pull request builds both pages and runs the docs.unmapped gate, without publishing (pages.yml publishes on a push to
# main). Its trigger lists the doc globs, so a docs-only pull request runs the gate too.
on:
  pull_request:
    paths:
      - "**/*.md"
      - "quality/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-build.yml"
      - ".github/workflows/pages-publish.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/pages-build.yml
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      vulnerability-alerts: read
