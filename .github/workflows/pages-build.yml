name: pages-build

# The build both pages workflows share: pages-publish.yml (a push to main, which publishes it) and pages.yml (a pull
# request, which only builds it, so the docs.unmapped gate runs). Git Crafter's pages (Git Crafter templates/ci/README.md):
# the Process page and the Quality, Speed and Consumption page, built by Git Crafter's actions/pages from
# quality/process/config.json and quality/config.json. Keep the pins full commit SHAs with their version comments;
# Dependabot's github-actions entry bumps them with ci.yml's.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # The collectors read this repo's pull requests, runs, checks and issues; a read refused is not measured.
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      # Dependabot's open alerts, read live on every run; without it they come from the last local snapshot.
      vulnerability-alerts: read
    steps:
      # Full history: the docs collector dates each doc against its area's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: SoulCraft-Org/git-crafter/actions/pages@33a63df0dba4faa56484047d61c5020252416844 # main 2026-11-23, light-run fix
        with:
          pages: process quality
          config: quality/process/config.json
          quality-config: quality/config.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: quality/dist
