# The gate for a SoulCraft workflow package (SoulCraft-Org/.github/.github/workflows/package-ci.yml).
name: ci

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: SoulCraft-Org/.github/.github/workflows/package-ci.yml@main
    secrets: inherit
