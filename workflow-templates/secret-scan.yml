name: secret-scan

# SoulCraft-Org starter: secret scanning that costs nothing. It calls the organization's shared gitleaks workflow, which
# scans the whole git history and fails on any finding, with the secret values redacted in the log. Save this file as
# .github/workflows/secret-scan.yml. The call is pinned to a full commit SHA so it cannot move under you; move the pin
# by hand to a newer commit once you have read it. A false positive goes in the
# repository's .gitleaksignore, one finding fingerprint per line, printed in the log.
on:
  pull_request:
  push:
    branches: [ $default-branch ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to the default branch always finishes.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    uses: SoulCraft-Org/.github/.github/workflows/gitleaks.yml@c6bd7cd79bf64b6bab497eead1aadb863a90e21f # reviewed commit
